<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 80 80" fill="none">
  <title>Icon Fairy folder-heart logo</title>
  <desc>White Lucide folder-heart on the orange and violet Community listing gradient. Lucide glyph licensed under ISC; see assets/licenses/lucide.txt.</desc>
  <!-- Lucide folder-heart, commit 05dd5fcfde07c36f6f113c6bc690802dcce8da15. -->
  <defs>
    <clipPath id="tile"><rect width="80" height="80" rx="16" /></clipPath>
    <linearGradient id="light" x1="40" y1="0" x2="40" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity=".18" />
      <stop offset="1" stop-color="black" stop-opacity=".18" />
    </linearGradient>
    <radialGradient id="violet" cx="40" cy="104" r="111.427765" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6" />
      <stop offset=".9" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="0" y="0" width="80" height="80" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="0" flood-color="black" flood-opacity=".2" />
    </filter>
  </defs>
  <g clip-path="url(#tile)" style="isolation:isolate">
    <path fill="#e9973f" d="M0 0h80v80H0z" />
    <path fill="url(#light)" d="M0 0h80v80H0z" style="mix-blend-mode:soft-light" />
    <path fill="url(#violet)" d="M0 0h80v80H0z" />
    <rect x=".5" y=".5" width="79" height="79" rx="15.5" stroke="white" stroke-opacity=".1" />
  </g>
  <g filter="url(#shadow)">
    <svg x="20" y="20" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.638 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v3.417" />
      <path d="M14.62 18.8A2.25 2.25 0 1 1 18 15.836a2.25 2.25 0 1 1 3.38 2.966l-2.626 2.856a.998.998 0 0 1-1.507 0z" />
    </svg>
  </g>
</svg>
